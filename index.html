<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Cadastro de Livros</title>
        <link rel="stylesheet" href="css/style.css" />
        <script src="js/post.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Cadastro de Livros</h1>
            <p>Preencha o formulário abaixo com os dados do seu livro!!⬇️</p>
        </header>
        <main>
            <section>
            <h2>Novo Livro</h2>

            <form id="form-livro">
                <label for="title">Nome do livro: </label>
                <input id="title" name="title" type="text" minlength="3" maxlength="120" required />

                <label for="autor">Nome do autor: </label>
                <input id="autor" name="autor" type="text" minlength="3" maxlength="120" required />

                <label for="genero">Gênero literário: </label>
                <input id="genero" name="genero" type="text" minlength="3" maxlength="120" required />

                <label for="ano_publicacao">Ano de publicação: </label>
                <input id="ano_publicacao" name="ano_publicacao" type="number" minlength="3" maxlength="120" required />

                <label for="numero_paginas">Número de páginas: </label>
                <input id="numero_paginas" name="numero_paginas" type="number" minlength="3" maxlength="120" required />

                <label for="imageUrl">URL da imagem (opcional): </label>
                <input id="imageUrl" name="imageUrl" type="url" />

                <button type="submit">Cadastrar Livro!</button>
            </form>

            <p id="resposta"></p>
            </section>
        </main>
    </body>
     <footer>
        <p class="smallletters">Prática de formulários HTML.</p>
      </footer>
</html>
